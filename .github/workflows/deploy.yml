name: 🚀 Deploy Contínuo (CI/CD) para VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy na VPS Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Conectar via SSH e Atualizar Contêineres
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Iniciando atualização na VPS..."
            cd /root/apps/carteira_investimentos || cd "$HOME/apps/carteira_investimentos"
            
            echo "📥 [CI/CD] Sincronizando com Git..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔨 [CI/CD] Executando script de deploy..."
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
            
            echo "✅ [CI/CD] Deploy finalizado com sucesso na VPS!"
